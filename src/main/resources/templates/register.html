<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | StyleFit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#FFFFFF',
                        surface: '#F8F7FC',
                        'surface-alt': '#F3E8FF',
                        primary: '#9333EA',
                        'primary-light': '#A855F7',
                        'primary-dark': '#7E22CE',
                        navy: '#0F172A',
                        text: '#0F172A',
                        'text-secondary': '#64748B',
                        'text-muted': '#94A3B8',
                        border: '#E2E8F0',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-surface text-text flex flex-col min-h-screen font-[Inter]">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-sm border border-border">
            <div class="text-center mb-8">
                <a href="/" class="inline-flex items-center gap-2 mb-6">
                    <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold text-2xl">
                        V
                    </div>
                </a>
                <h2 class="text-3xl font-bold text-navy tracking-tight mb-2">Create Account</h2>
                <p class="text-text-secondary">Join StyleFit today</p>
            </div>
            
            <div id="errorBox" class="hidden p-4 rounded-xl border mb-6 text-sm text-center">
            </div>

            <form id="registerForm" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-navy mb-2">Full Name</label>
                    <input id="name" name="name" type="text" required class="appearance-none relative block w-full px-4 py-3 border border-border placeholder-text-muted text-navy bg-surface rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm" placeholder="John Doe">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-navy mb-2">Email Address</label>
                    <input id="email" name="email" type="email" required class="appearance-none relative block w-full px-4 py-3 border border-border placeholder-text-muted text-navy bg-surface rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm" placeholder="you@example.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-navy mb-2">Password</label>
                    <input id="password" name="password" type="password" required class="appearance-none relative block w-full px-4 py-3 border border-border placeholder-text-muted text-navy bg-surface rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm" placeholder="••••••••">
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all shadow-md shadow-primary/20">
                        Sign Up
                    </button>
                </div>
            </form>
            
            <div class="mt-8 text-center">
                <p class="text-sm text-text-secondary">
                    Already have an account? 
                    <a href="/login" class="font-bold text-primary hover:text-primary-dark transition-colors">Sign in</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    window.location.href = '/stylefit';
                } else if (response.status === 409) {
                    const errorBox = document.getElementById('errorBox');
                    errorBox.className = 'bg-purple-50 text-slate-700 p-4 rounded-xl border border-purple-200 mb-6 text-sm text-center';
                    errorBox.innerHTML = 'An account with this email already exists.<br><span class="inline-block mt-2">Already have an account? <a href="/login" class="font-bold text-primary hover:text-primary-dark">Sign in</a></span>';
                    errorBox.classList.remove('hidden');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                } else if (response.status >= 400 && response.status < 500) {
                    const errorBox = document.getElementById('errorBox');
                    errorBox.className = 'bg-red-50 text-red-500 p-4 rounded-xl border border-red-200 mb-6 text-sm text-center';
                    errorBox.textContent = data.message || 'Please check your details and try again.';
                    errorBox.classList.remove('hidden');
                } else {
                    const errorBox = document.getElementById('errorBox');
                    errorBox.className = 'bg-red-50 text-red-500 p-4 rounded-xl border border-red-200 mb-6 text-sm text-center';
                    errorBox.textContent = 'Something went wrong. Please try again.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                const errorBox = document.getElementById('errorBox');
                errorBox.className = 'bg-red-50 text-red-500 p-4 rounded-xl border border-red-200 mb-6 text-sm text-center';
                errorBox.textContent = 'Something went wrong. Please try again.';
                errorBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
