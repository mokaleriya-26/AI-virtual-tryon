<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>
    <div th:fragment="navbar">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center">
                        <a href="/" class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold text-xl">
                                V
                            </div>
                            <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-purple-900 tracking-tight">
                                VirtualFit AI
                            </span>
                        </a>
                        
                        <div class="hidden md:flex ml-10 space-x-8">
                            <a href="/" class="text-slate-900 hover:text-purple-600 font-medium transition-colors">Home</a>
                            <a href="/shop" class="text-slate-900 hover:text-purple-600 font-medium transition-colors">Shop</a>
                            <a href="/stylefit" class="text-slate-900 hover:text-purple-600 font-medium transition-colors">StyleFit</a>
                            <a href="/history" class="text-slate-900 hover:text-purple-600 font-medium transition-colors">Try-On History</a>
                        </div>
                    </div>
                    
                    <div class="hidden md:flex items-center space-x-4">
                        <div class="relative">
                            <input type="text" placeholder="Search..." class="w-48 pl-10 pr-4 py-2 rounded-full border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <svg class="absolute left-3 top-2.5 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        
                        <a href="/wishlist" class="p-2 text-gray-600 hover:text-purple-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        </a>
                        
                        <a href="/cart" class="p-2 text-gray-600 hover:text-purple-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        </a>
                        
                        <!-- Logged out view -->
                        <a sec:authorize="isAnonymous()" href="/login" class="ml-2 bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-full font-medium transition-all shadow-sm shadow-purple-600/30">
                            Sign In
                        </a>
                        
                        <!-- Logged in view -->
                        <div sec:authorize="isAuthenticated()" class="ml-2 flex items-center space-x-2">
                            <a href="/profile" class="text-slate-900 font-medium hover:text-purple-600 flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center text-purple-700 font-bold">
                                    <span sec:authentication="name" class="uppercase text-xs"></span>
                                </div>
                            </a>
                            <form action="/api/auth/logout" method="post" class="inline">
                                <button type="submit" class="text-sm text-gray-500 hover:text-red-500 ml-2">Sign Out</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </div>
</body>
</html>
