spring.application.name=virtualfit-ai
server.port=8080

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/virtualfit}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

jwt.secret=${JWT_SECRET:change-this-secret-to-something-secure-in-production-long-enough-for-hs256}
jwt.expiration=86400000

huggingface.api.token=${HUGGINGFACE_API_TOKEN:}
huggingface.model=${HUGGINGFACE_MODEL:IDM-VTON}
huggingface.api.url=https://yisol-idm-vton.hf.space/api/predict

app.upload-dir=${UPLOAD_DIR:uploads}
app.generated-dir=${GENERATED_DIR:generated}
